<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle King</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#101827d9;padding:9px 12px;border:1px solid #ffffff55;border-radius:12px;font-weight:bold}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick,#fire,#shop{pointer-events:auto;border:2px solid #ffffff99;background:#1b2b43dd;color:white;border-radius:50%;font-weight:bold;touch-action:none}
#stick{width:112px;height:112px;display:grid;place-items:center;color:#b8c7d9}
#fire{width:76px;height:76px;background:#b83232dd}
#shop{border-radius:12px;padding:12px 14px;background:#b8871c}
#panel{display:none;position:fixed;inset:12% 6%;background:#17243af5;border:2px solid #ffd166;border-radius:16px;padding:16px;z-index:4;overflow:auto}
#panel button{padding:10px;border:0;border-radius:9px;background:#ffd166;font-weight:bold;margin:5px}
.small{font-size:12px;color:#cbd5e1;line-height:1.45}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">⚔️ BATTLE KING</div><div class="pill">❤️ <span id="hp">100</span>　🪙 <span id="coins">500</span></div></div>
<div id="controls"><div id="stick">MOVE</div><button id="shop">🪙 SHOP</button><button id="fire">FIRE</button></div>
<div id="panel"><h2>🪙 Skin Shop</h2><p class="small">Demo coins are virtual only. Skins are cosmetic.</p><div id="items"></div><button id="close">BACK TO GAME</button></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,player={x:0,y:0,r:17,hp:100},coins=500,owned=['Blue'],skin='Blue',enemies=[],shots=[],move={x:0,y:0},score=0;
const colors={Blue:'#39a8ff',Red:'#ef6255',Green:'#47c78a',Purple:'#ad82ff'};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;player.x=W/2;player.y=H/2}addEventListener('resize',resize);resize();
function spawn(){let a=Math.random()*Math.PI*2,d=Math.max(W,H)*.65;enemies.push({x:W/2+Math.cos(a)*d,y:H/2+Math.sin(a)*d,r:15,hp:2,s:0.65+Math.random()*.45})}for(let i=0;i<5;i++)spawn();
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#1b3a35';ctx.fillRect(0,0,W,H);
 // arena grid
 ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // distant cover rocks
 for(let i=0;i<9;i++){let x=(i*137+70)%W,y=(i*211+90)%H;ctx.fillStyle='#65756c';ctx.beginPath();ctx.ellipse(x,y,22,13,0,0,Math.PI*2);ctx.fill()}
 for(const s of shots){ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()}
 for(const e of enemies){ctx.fillStyle='#d95757';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#271b20';ctx.fillRect(e.x-7,e.y-3,4,4);ctx.fillRect(e.x+4,e.y-3,4,4)}
 ctx.fillStyle=colors[skin];ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(player.x,player.y-5,6,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('Score: '+score, W/2-28, 70);
 requestAnimationFrame(draw)
}
function update(){player.x=Math.max(18,Math.min(W-18,player.x+move.x*3));player.y=Math.max(18,Math.min(H-18,player.y+move.y*3));
 enemies.forEach(e=>{let dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.s;e.y+=dy/l*e.s;if(l<player.r+e.r){player.hp=Math.max(0,player.hp-.08);document.getElementById('hp').textContent=Math.floor(player.hp)}});
 shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;enemies.forEach(e=>{if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){e.hp=0;score++;coins+=5;document.getElementById('coins').textContent=coins}})});
 enemies=enemies.filter(e=>e.hp>0);shots=shots.filter(s=>s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);while(enemies.length<5)spawn();requestAnimationFrame(update)}
function fire(){if(!enemies.length)return;let e=enemies.reduce((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)<Math.hypot(b.x-player.x,b.y-player.y)?a:b);let dx=e.x-player.x,dy=e.y-player.y,l=Math.hypot(dx,dy)||1;shots.push({x:player.x,y:player.y,vx:dx/l*7,vy:dy/l*7})}
const stick=document.getElementById('stick');let active=false;stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);move.x=0;move.y=0});stick.addEventListener('pointermove',e=>{if(!active)return;let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy)||1;move.x=dx/l*Math.min(1,l/40);move.y=dy/l*Math.min(1,l/40)});['pointerup','pointercancel'].forEach(t=>stick.addEventListener(t,()=>{active=false;move={x:0,y:0}}));
document.getElementById('fire').onclick=fire;
document.getElementById('shop').onclick=()=>{document.getElementById('panel').style.display='block';renderShop()};
document.getElementById('close').onclick=()=>document.getElementById('panel').style.display='none';
function renderShop(){let box=document.getElementById('items');box.innerHTML='';Object.entries({Blue:0,Red:100,Green:200,Purple:300}).forEach(([n,p])=>{let b=document.createElement('button');b.textContent=owned.includes(n)?n+' ✓':n+' — '+p+' coins';b.onclick=()=>{if(!owned.includes(n)&&coins>=p){coins-=p;owned.push(n)}if(owned.includes(n))skin=n;document.getElementById('coins').textContent=coins;renderShop()};box.appendChild(b)})}
draw();update();
</script></body></html>
